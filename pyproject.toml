[project]
name = "WhotOnline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.123.0",
    "pydantic-settings>=2.12.0",
    "redis>=7.1.0",
    "uvicorn>=0.38.0",
    "websockets>=15.0.1",
]

[project.optional-dependencies]
rl = [
    "gymnasium>=0.29.0",
    "numpy>=2.0.0",
    "torch>=2.6.0,<2.7",
    "stable-baselines3>=2.3.0",
    "sb3-contrib>=2.3.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "fakeredis[lua]>=2.26.0",
    "gymnasium>=0.29.0",
    "numpy>=2.0.0",
    "torch>=2.6.0,<2.7",
    "stable-baselines3>=2.3.0",
    "sb3-contrib>=2.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
